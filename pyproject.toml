[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swifttailor"
version = "1.0.0"
description = "SwiftTailor: Efficient 3D Garment Generation with Geometry Image Representation"
readme = "README.md"
license = {text = "BSD-3-Clause-Clear"}
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["swifttailor"]
